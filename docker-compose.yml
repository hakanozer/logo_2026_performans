services:
  restapi:
    build:
      context: ./RestApi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./RestApi/data:/app/data
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/restapi.db
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-logo-2026-restapi}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DT_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Api-Token%20${DT_OTEL_TOKEN}

  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=jmeter

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false