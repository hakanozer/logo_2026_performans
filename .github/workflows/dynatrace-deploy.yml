name: Build & Notify Dynatrace

on:
  push:
    branches: [ master ]
    paths:
      - "RestApi/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/restapi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./RestApi
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Marks a deployment event on the Dynatrace timeline, tied to the GitHub commit.
      # Requires a Dynatrace API token (not the platform token) with the "events.ingest" scope.
      - name: Send deployment event to Dynatrace
        run: |
          curl -sSf -X POST "${{ secrets.DT_API_URL }}/api/v2/events/ingest" \
            -H "Authorization: Api-Token ${{ secrets.DT_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_DEPLOYMENT",
              "title": "GitHub Actions deployment",
              "properties": {
                "dt.event.deployment.name": "restapi-'"${{ github.sha }}"'",
                "dt.event.deployment.version": "'"${{ github.sha }}"'",
                "release.product": "logo_2026_performans-restapi",
                "release.version": "'"${{ github.sha }}"'",
                "ci.pipeline.url": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
              }
            }'
