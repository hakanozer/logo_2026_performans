name: Build & Notify Dynatrace

on:
  push:
    branches: [ master ]
    paths:
      - "RestApi/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/restapi
  DT_API_URL: https://ubs13257.live.dynatrace.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ./RestApi
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore and build telemetry test app
        run: dotnet build RestApi/RestApi.csproj --configuration Release

      - name: Run API traffic and send telemetry
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:8080
          OTEL_SERVICE_NAME: logo-2026-restapi
          OTEL_EXPORTER_OTLP_ENDPOINT: https://ubs13257.live.dynatrace.com/api/v2/otlp
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: Authorization=Api-Token%20${{ secrets.DT_OTEL_TOKEN }}
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_BSP_SCHEDULE_DELAY: "5000"
        run: |
          set -euo pipefail
          trap 'cat /tmp/restapi.log 2>/dev/null || true' EXIT
          dotnet run --project RestApi/RestApi.csproj --configuration Release --no-build \
            --no-restore --urls http://127.0.0.1:8080 > /tmp/restapi.log 2>&1 &
          api_pid=$!

          for attempt in {1..30}; do
            response_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/Product || true)
            if [ "$response_code" != "000" ]; then
              break
            fi
            sleep 2
          done

          if [ "$response_code" = "000" ]; then
            kill "$api_pid" || true
            exit 1
          fi

          for request_number in {1..30}; do
            curl -sS -o /dev/null http://127.0.0.1:8080/api/Product || true
          done

          username="dt-${GITHUB_RUN_ID}"
          password="TelemetryTest123!"
          curl -sS -X POST http://127.0.0.1:8080/api/Auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$username\",\"password\":\"$password\",\"role\":\"Product\"}" \
            -o /tmp/register.json || true

          login_response=$(curl -sS -X POST http://127.0.0.1:8080/api/Auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$username\",\"password\":\"$password\"}" || true)
          token=$(printf '%s' "$login_response" | jq -r '.token // .Token')

          if [ -n "$token" ] && [ "$token" != "null" ]; then
            for request_number in {1..30}; do
              curl -sS -o /dev/null http://127.0.0.1:8080/api/Product \
                -H "Authorization: Bearer $token" || true
            done
          fi

          sleep 10
          kill "$api_pid" || true
          wait "$api_pid" || true

      # Marks a deployment event on the Dynatrace timeline, tied to the GitHub commit.
      # Requires an environment API token with the events.ingest scope.
      - name: Send deployment event to Dynatrace
        run: |
          curl -sSf -X POST "${{ env.DT_API_URL }}/api/v2/events/ingest" \
            -H "Authorization: Api-Token ${{ secrets.DT_DEPLOYMENT_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "eventType": "CUSTOM_DEPLOYMENT",
              "title": "GitHub Actions deployment",
              "properties": {
                "dt.event.deployment.name": "restapi-'"${{ github.sha }}"'",
                "dt.event.deployment.version": "'"${{ github.sha }}"'",
                "release.product": "logo_2026_performans-restapi",
                "release.version": "'"${{ github.sha }}"'",
                "ci.pipeline.url": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
              }
            }'
